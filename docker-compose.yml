version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: maskguard_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: maskguard_db
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maskguard_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=maskguard_db
      - SECRET_KEY=replace-with-a-real-secret-in-production-2026
      - AI_PROVIDER=demo
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maskguard_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
